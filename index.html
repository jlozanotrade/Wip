<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIP 26 — Buscador de Proyectos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap');

  :root {
    --bg:       #0f1117;
    --bg2:      #181c27;
    --bg3:      #1e2335;
    --border:   #2a3050;
    --accent:   #4f8ef7;
    --accent2:  #7c6af7;
    --green:    #3ecf8e;
    --red:      #f26b6b;
    --amber:    #f5a623;
    --text:     #e8eaf6;
    --muted:    #7880a0;
    --mono:     'DM Mono', monospace;
    --sans:     'Sora', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; }

  /* ── UPLOAD SCREEN ── */
  #upload-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 2rem; padding: 2rem;
  }
  .logo { font-size: 11px; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; font-family: var(--mono); }
  .title { font-size: 2.2rem; font-weight: 600; text-align: center; line-height: 1.2;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { color: var(--muted); font-size: .9rem; text-align: center; max-width: 400px; line-height: 1.6; }
  .drop-zone {
    border: 1.5px dashed var(--border); border-radius: 16px; padding: 3rem 4rem;
    text-align: center; cursor: pointer; transition: all .2s; background: var(--bg2);
    width: 100%; max-width: 480px;
  }
  .drop-zone:hover, .drop-zone.drag { border-color: var(--accent); background: #1a2040; }
  .drop-zone svg { color: var(--accent); margin-bottom: 1rem; }
  .drop-zone p { color: var(--muted); font-size: .85rem; margin-top: .5rem; }
  .drop-zone strong { color: var(--text); display: block; margin-bottom: .25rem; }
  #file-input { display: none; }
  .loading { display: none; flex-direction: column; align-items: center; gap: 1rem; }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── MAIN APP ── */
  #app { display: none; flex-direction: column; min-height: 100vh; }
  header {
    display: flex; align-items: center; gap: 1rem; padding: .75rem 1.5rem;
    background: var(--bg2); border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .h-brand { font-size: .75rem; letter-spacing: .15em; color: var(--muted); font-family: var(--mono); text-transform: uppercase; margin-right: auto; }
  .h-file { font-size: .75rem; color: var(--accent); font-family: var(--mono); }
  .btn-reset { background: none; border: 1px solid var(--border); color: var(--muted); padding: .35rem .75rem;
    border-radius: 6px; cursor: pointer; font-size: .75rem; font-family: var(--sans); transition: all .15s; }
  .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

  .search-bar {
    display: flex; gap: .75rem; padding: 1rem 1.5rem; background: var(--bg2);
    border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: .35rem; flex: 1; min-width: 200px; }
  .field label { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-family: var(--mono); }
  .field select, .field input {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    padding: .5rem .75rem; border-radius: 8px; font-family: var(--sans); font-size: .85rem;
    outline: none; transition: border-color .15s; appearance: none;
  }
  .field select:focus, .field input:focus { border-color: var(--accent); }
  .field select option { background: var(--bg3); }

  /* ── AUTOCOMPLETE ── */
  .autocomplete-wrap { position: relative; }
  .autocomplete-wrap input { width: 100%; }
  .ac-dropdown {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 100;
    background: var(--bg3); border: 1px solid var(--accent); border-radius: 8px;
    max-height: 240px; overflow-y: auto; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .ac-dropdown.open { display: block; }
  .ac-item {
    padding: .55rem .85rem; cursor: pointer; font-size: .84rem;
    border-bottom: 1px solid var(--border); transition: background .1s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item.selected { background: #2a3560; color: var(--accent); }
  .ac-item mark { background: none; color: var(--accent2); font-weight: 600; }
  .ac-clear {
    position: absolute; right: .6rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 1rem; line-height: 1; display: none; padding: .1rem .3rem;
  }
  .ac-clear:hover { color: var(--text); }
  .ac-tag {
    display: inline-flex; align-items: center; gap: .4rem;
    background: #1e2d55; border: 1px solid var(--accent); color: var(--accent);
    border-radius: 20px; padding: .25rem .7rem; font-size: .78rem; font-family: var(--mono);
    margin-top: .3rem;
  }
  .ac-tag button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: .9rem; line-height:1; padding:0; }
  .ac-tag button:hover { color: var(--red); }

  main { flex: 1; padding: 1.5rem; overflow-y: auto; }

  /* ── PROJECT LIST ── */
  #list-view { display: flex; flex-direction: column; gap: .5rem; }
  .proj-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    padding: .85rem 1.1rem; cursor: pointer; transition: all .15s;
    display: flex; align-items: center; gap: 1rem;
  }
  .proj-card:hover { border-color: var(--accent); background: #1a2040; }
  .proj-cod { font-family: var(--mono); font-size: .8rem; color: var(--accent); min-width: 110px; }
  .proj-name { flex: 1; font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj-client { font-size: .78rem; color: var(--muted); min-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj-rev { font-family: var(--mono); font-size: .82rem; min-width: 100px; text-align: right; }
  .empty { color: var(--muted); text-align: center; padding: 3rem; font-size: .9rem; }
  .count { font-size: .75rem; color: var(--muted); font-family: var(--mono); margin-bottom: .75rem; }

  /* ── PROJECT DETAIL ── */
  #detail-view { display: none; }
  .back-btn {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-family: var(--sans); font-size: .85rem; display: flex; align-items: center; gap: .4rem;
    margin-bottom: 1.25rem; padding: 0;
  }
  .back-btn:hover { opacity: .7; }

  .detail-header { margin-bottom: 1.5rem; }
  .detail-cod { font-family: var(--mono); font-size: .85rem; color: var(--accent); margin-bottom: .35rem; }
  .detail-name { font-size: 1.4rem; font-weight: 600; line-height: 1.3; margin-bottom: .5rem; }
  .detail-meta { display: flex; gap: 1rem; flex-wrap: wrap; }
  .badge {
    font-size: .7rem; padding: .25rem .6rem; border-radius: 20px; font-family: var(--mono);
    border: 1px solid var(--border); color: var(--muted);
  }
  .badge.green { border-color: var(--green); color: var(--green); }
  .badge.amber { border-color: var(--amber); color: var(--amber); }
  .badge.red   { border-color: var(--red);   color: var(--red);   }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1rem; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1rem; }
  @media (max-width: 700px) { .grid-2,.grid-3,.grid-4 { grid-template-columns: 1fr 1fr; } }

  .kpi {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    padding: .9rem 1.1rem;
  }
  .kpi-label { font-size: .65rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); font-family: var(--mono); margin-bottom: .4rem; }
  .kpi-value { font-size: 1.25rem; font-weight: 500; font-family: var(--mono); }
  .kpi-value.green { color: var(--green); }
  .kpi-value.red   { color: var(--red);   }
  .kpi-value.amber { color: var(--amber); }
  .kpi-sub { font-size: .7rem; color: var(--muted); margin-top: .2rem; }

  .section-title { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); font-family: var(--mono); margin: 1.5rem 0 .75rem; border-bottom: 1px solid var(--border); padding-bottom: .5rem; }

  /* ── MONTHLY TABLE ── */
  .monthly-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .78rem; min-width: 700px; }
  th { font-family: var(--mono); font-size: .65rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); padding: .5rem .75rem; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child { text-align: left; }
  td { padding: .45rem .75rem; text-align: right; border-bottom: 1px solid #1a1f30; font-family: var(--mono); color: var(--text); white-space: nowrap; }
  td:first-child { text-align: left; color: var(--muted); font-size: .72rem; }
  tr:last-child td { border-bottom: none; }
  tr.total-row td { border-top: 1px solid var(--border); font-weight: 500; color: var(--text); }
  tr.past td { color: var(--text); }
  tr.future td { color: var(--muted); }
  tr.current td { color: var(--accent); }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
</style>
</head>
<body>

<!-- UPLOAD -->
<div id="upload-screen">
  <p class="logo">Tradesegur · Gestión de Proyectos</p>
  <h1 class="title">Buscador WIP 26</h1>
  <p class="subtitle">Sube el fichero Excel mensual para explorar proyectos, revenues, costes y seguimiento de cualquier proyecto.</p>
  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5v-9m0 0-3 3m3-3 3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z"/>
    </svg>
    <strong>Arrastra el Excel aquí</strong>
    <p>o haz clic para seleccionar el fichero WIP_26.xlsx</p>
  </div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="color:var(--muted);font-size:.85rem">Procesando fichero...</p>
  </div>
  <input type="file" id="file-input" accept=".xlsx,.xls">
</div>

<!-- APP -->
<div id="app">
  <header>
    <span class="h-brand">WIP 26 · Buscador</span>
    <span class="h-file" id="h-file"></span>
    <button class="btn-reset" onclick="resetApp()">↩ Cambiar fichero</button>
  </header>

  <div class="search-bar">
    <div class="field" style="max-width:280px">
      <label>Cuenta / Cliente</label>
      <div class="autocomplete-wrap" id="ac-wrap">
        <input type="text" id="ac-input" placeholder="Escribe parte del nombre..." autocomplete="off" oninput="onAcInput()" onkeydown="onAcKey(event)" onfocus="onAcFocus()">
        <button class="ac-clear" id="ac-clear" onclick="clearCliente()" title="Limpiar">✕</button>
        <div class="ac-dropdown" id="ac-dropdown"></div>
      </div>
      <div id="ac-tag-wrap"></div>
    </div>
    <div class="field" style="max-width:320px">
      <label>Proyecto</label>
      <select id="sel-proyecto" onchange="onProyectoChange()">
        <option value="">— Selecciona proyecto —</option>
      </select>
    </div>
    <div class="field">
      <label>Buscar por nombre o código</label>
      <input type="text" id="search-input" placeholder="ej: CCTV, UT-2524..." oninput="onSearch()">
    </div>
    <div class="field" style="max-width:180px">
      <label>Zona</label>
      <select id="sel-zona" onchange="renderList()">
        <option value="">— Todas —</option>
      </select>
    </div>
    <div class="field" style="max-width:200px">
      <label>Línea de negocio</label>
      <select id="sel-linea" onchange="renderList()">
        <option value="">— Todas —</option>
      </select>
    </div>
  </div>

  <main>
    <div id="list-view"></div>
    <div id="detail-view"></div>
  </main>
</div>

<script>
let allProjects = [];
let fileName = '';
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const CURRENT_MONTH = 3; // abril = index 3 (0-based)

// ── FILE HANDLING ──────────────────────────────────────────────────────────
const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag'); processFile(e.dataTransfer.files[0]); });
document.getElementById('file-input').addEventListener('change', e => processFile(e.target.files[0]));

function processFile(file) {
  if (!file) return;
  fileName = file.name;
  document.getElementById('drop-zone').style.display = 'none';
  document.getElementById('loading').style.display = 'flex';

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      const ws = wb.Sheets['WIP 26 TRD'];
      if (!ws) { alert('No se encontró la hoja "WIP 26 TRD"'); resetApp(); return; }
      const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
      parseProjects(data);
      initApp();
    } catch(err) {
      alert('Error al leer el fichero: ' + err.message);
      resetApp();
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseProjects(data) {
  allProjects = [];
  const n = v => { const f = parseFloat(v); return isNaN(f) ? 0 : f; };
  const s = v => v != null ? String(v).trim() : '';

  for (let r = 9; r < data.length; r++) {
    const row = data[r];
    if (!row || !row[0] || s(row[0]) === 'Proyecto') continue;
    const cod = s(row[0]);
    if (!cod) continue;

    const months = [];
    for (let i = 0; i < 12; i++) {
      const base = 22 + i * 5;
      months.push({ ing: n(row[base]), gtos: n(row[base+1]), prov: n(row[base+2]), wip: n(row[base+3]) });
    }

    allProjects.push({
      cod, nombre: s(row[2]), cliente: s(row[3]), interco: s(row[4]),
      linea: s(row[5]), tipo: s(row[6]), zona: s(row[7]), estado: s(row[8]),
      importe: n(row[9]), wip_flag: s(row[10]),
      rent_sf: n(row[11]), r_aplicada: n(row[12]), r_aplicar: n(row[14]),
      coste_est: n(row[15]), resp: s(row[99]),
      ing_2025: n(row[17]), gtos_2025: n(row[18]), prov_2025: n(row[19]), wip_2025: n(row[20]),
      months,
      rev_mes: n(row[92]), wip_origen: n(row[93]), wip_2026: n(row[94]),
      rev_2026: n(row[95]), backlog: n(row[96]), fact_pdte: n(row[97]),
    });
  }
}

let allClientes = [];
let selectedCliente = '';
let acIndex = -1;

function initApp() {
  document.getElementById('upload-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('h-file').textContent = fileName;

  allClientes = [...new Set(allProjects.map(p => p.cliente).filter(c => c && c !== '0'))].sort();

  const zonas  = [...new Set(allProjects.map(p => p.zona).filter(z => z && z !== '0' && z !== '#N/A'))].sort();
  const lineas = [...new Set(allProjects.map(p => p.linea).filter(l => l && l !== '0' && l !== '#N/A'))].sort();

  const selZ = document.getElementById('sel-zona');
  zonas.forEach(z => { const o = document.createElement('option'); o.value = z; o.textContent = z; selZ.appendChild(o); });

  const selL = document.getElementById('sel-linea');
  lineas.forEach(l => { const o = document.createElement('option'); o.value = l; o.textContent = l; selL.appendChild(o); });

  // Close dropdown on outside click
  document.addEventListener('click', e => {
    if (!document.getElementById('ac-wrap').contains(e.target)) closeAcDropdown();
  });

  renderList();
}

// ── AUTOCOMPLETE ────────────────────────────────────────────────────────────
function onAcInput() {
  const q = document.getElementById('ac-input').value.trim().toLowerCase();
  document.getElementById('ac-clear').style.display = q ? 'block' : 'none';
  selectedCliente = '';
  updateProyectoSelect();
  document.getElementById('ac-tag-wrap').innerHTML = '';

  if (!q) { closeAcDropdown(); renderList(); return; }

  const matches = allClientes.filter(c => c.toLowerCase().includes(q)).slice(0, 30);
  renderAcDropdown(matches, q);
  renderList();
}

function onAcFocus() {
  const q = document.getElementById('ac-input').value.trim().toLowerCase();
  if (q && !selectedCliente) {
    const matches = allClientes.filter(c => c.toLowerCase().includes(q)).slice(0, 30);
    renderAcDropdown(matches, q);
  }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return escHtml(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx < 0) return escHtml(text);
  return escHtml(text.slice(0, idx)) + '<mark>' + escHtml(text.slice(idx, idx + q.length)) + '</mark>' + escHtml(text.slice(idx + q.length));
}

function renderAcDropdown(matches, q) {
  const dd = document.getElementById('ac-dropdown');
  acIndex = -1;
  if (!matches.length) {
    dd.innerHTML = '<div class="ac-item" style="color:var(--muted)">Sin resultados</div>';
    dd.classList.add('open');
    return;
  }
  dd.innerHTML = matches.map(c => {
    const safeVal = escHtml(c);
    const safeIdx = allClientes.indexOf(c);
    return '<div class="ac-item" data-idx="' + safeIdx + '" onmousedown="selectClienteByIdx(' + safeIdx + ', event)">' + highlight(c, q) + '</div>';
  }).join('');
  dd.classList.add('open');
}

function selectClienteByIdx(idx, e) {
  if (e) e.preventDefault();
  const cliente = allClientes[idx];
  if (!cliente) return;
  selectedCliente = cliente;
  document.getElementById('ac-input').value = '';
  document.getElementById('ac-clear').style.display = 'none';
  closeAcDropdown();
  document.getElementById('search-input').value = '';
  document.getElementById('ac-tag-wrap').innerHTML =
    '<div class="ac-tag">' + cliente + '<button onclick="clearCliente()" title="Quitar">✕</button></div>';
  updateProyectoSelect();
  renderList();
}

function selectCliente(cliente, e) {
  const idx = allClientes.indexOf(cliente);
  selectClienteByIdx(idx >= 0 ? idx : 0, e);
}

function clearCliente() {
  selectedCliente = '';
  document.getElementById('ac-input').value = '';
  document.getElementById('ac-clear').style.display = 'none';
  document.getElementById('ac-tag-wrap').innerHTML = '';
  closeAcDropdown();
  document.getElementById('sel-proyecto').innerHTML = '<option value="">— Selecciona proyecto —</option>';
  renderList();
}

function closeAcDropdown() {
  document.getElementById('ac-dropdown').classList.remove('open');
  acIndex = -1;
}

function onAcKey(e) {
  const dd = document.getElementById('ac-dropdown');
  const items = dd.querySelectorAll('.ac-item[data-val]');
  if (!items.length) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    acIndex = Math.min(acIndex + 1, items.length - 1);
    items.forEach((el,i) => el.classList.toggle('selected', i === acIndex));
    items[acIndex]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    acIndex = Math.max(acIndex - 1, 0);
    items.forEach((el,i) => el.classList.toggle('selected', i === acIndex));
    items[acIndex]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter' && acIndex >= 0) {
    e.preventDefault();
    selectClienteByIdx(parseInt(items[acIndex].dataset.idx));
  } else if (e.key === 'Escape') {
    closeAcDropdown();
  }
}

function updateProyectoSelect() {
  const selP = document.getElementById('sel-proyecto');
  selP.innerHTML = '<option value="">— Selecciona proyecto —</option>';
  if (!selectedCliente) return;
  const projs = allProjects.filter(p => p.cliente === selectedCliente)
    .sort((a,b) => a.nombre.localeCompare(b.nombre));
  projs.forEach(p => {
    const o = document.createElement('option');
    o.value = p.cod;
    o.textContent = `${p.cod} · ${p.nombre.substring(0,55)}`;
    selP.appendChild(o);
  });
}

function resetApp() {
  document.getElementById('upload-screen').style.display = 'flex';
  document.getElementById('drop-zone').style.display = 'block';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  document.getElementById('file-input').value = '';
  allProjects = [];
}

// ── FILTERS ────────────────────────────────────────────────────────────────
function onProyectoChange() {
  const cod = document.getElementById('sel-proyecto').value;
  if (cod) showDetail(cod);
  else renderList();
}

function onSearch() {
  clearCliente();
  renderList();
}

function getFiltered() {
  const query  = document.getElementById('search-input').value.toLowerCase().trim();
  const acQ    = selectedCliente ? '' : document.getElementById('ac-input').value.toLowerCase().trim();
  const zona   = document.getElementById('sel-zona').value;
  const linea  = document.getElementById('sel-linea').value;

  return allProjects.filter(p => {
    if (selectedCliente && p.cliente !== selectedCliente) return false;
    if (!selectedCliente && acQ && !p.cliente.toLowerCase().includes(acQ)) return false;
    if (zona  && p.zona  !== zona)  return false;
    if (linea && p.linea !== linea) return false;
    if (query) {
      const hay = p.cod.toLowerCase() + p.nombre.toLowerCase() + p.cliente.toLowerCase() + p.resp.toLowerCase();
      if (!hay.includes(query)) return false;
    }
    return true;
  });
}

// ── LIST VIEW ──────────────────────────────────────────────────────────────
function renderList() {
  document.getElementById('detail-view').style.display = 'none';
  const lv = document.getElementById('list-view');
  lv.style.display = 'block';

  const projects = getFiltered();
  if (!projects.length) { lv.innerHTML = '<p class="empty">No se encontraron proyectos</p>'; return; }

  const fmt = v => v !== 0 ? new Intl.NumberFormat('es-ES', {maximumFractionDigits:0}).format(v) + ' €' : '—';
  const colorRev = v => v > 0 ? 'pos' : v < 0 ? 'neg' : '';

  lv.innerHTML = `<p class="count">${projects.length} proyecto${projects.length !== 1 ? 's' : ''}</p>` +
    projects.slice(0, 200).map(p => `
    <div class="proj-card" onclick="showDetail('${p.cod}')">
      <span class="proj-cod">${p.cod}</span>
      <span class="proj-name" title="${p.nombre}">${p.nombre || '—'}</span>
      <span class="proj-client" title="${p.cliente}">${p.cliente || '—'}</span>
      <span class="proj-rev ${colorRev(p.rev_2026)}">${fmt(p.rev_2026)}</span>
    </div>`).join('') +
    (projects.length > 200 ? `<p class="empty" style="padding:1rem">Mostrando 200 de ${projects.length}. Usa los filtros para acotar.</p>` : '');
}

// ── DETAIL VIEW ────────────────────────────────────────────────────────────
function showDetail(cod) {
  const p = allProjects.find(x => x.cod === cod);
  if (!p) return;

  document.getElementById('list-view').style.display = 'none';
  const dv = document.getElementById('detail-view');
  dv.style.display = 'block';

  const fmt  = (v, dec=0) => new Intl.NumberFormat('es-ES', {maximumFractionDigits:dec}).format(v);
  const fmtE = (v, dec=0) => (v !== 0 ? fmt(v, dec) + ' €' : '—');
  const fmtP = v => v !== 0 ? (v * 100).toFixed(1) + '%' : '—';
  const sign = v => (v > 0 ? '+' : '') + fmt(v) + ' €';
  const cls  = v => v >= 0 ? 'pos' : 'neg';
  const rentColor = v => v >= 0.3 ? 'green' : v >= 0.15 ? 'amber' : 'red';

  // Monthly table
  const months = p.months;
  const monthRows = MESES.map((mes, i) => {
    const m = months[i];
    const rowClass = i < CURRENT_MONTH ? 'past' : i === CURRENT_MONTH ? 'current' : 'future';
    const mb = m.ing - m.gtos - m.prov;
    return `<tr class="${rowClass}">
      <td>${mes} 26 ${i === CURRENT_MONTH ? '●' : ''}</td>
      <td>${fmtE(m.ing)}</td>
      <td>${fmtE(m.gtos)}</td>
      <td>${fmtE(m.prov)}</td>
      <td>${fmtE(m.gtos + m.prov)}</td>
      <td class="${cls(mb)}">${fmtE(mb)}</td>
      <td>${fmtE(m.wip)}</td>
    </tr>`;
  }).join('');

  const totIng  = months.reduce((s,m) => s+m.ing,  0);
  const totGtos = months.reduce((s,m) => s+m.gtos, 0);
  const totProv = months.reduce((s,m) => s+m.prov, 0);
  const totCost = totGtos + totProv;
  const totMB   = totIng - totCost;

  dv.innerHTML = `
    <button class="back-btn" onclick="renderList()">← Volver a la lista</button>

    <div class="detail-header">
      <div class="detail-cod">${p.cod}</div>
      <div class="detail-name">${p.nombre || '—'}</div>
      <div class="detail-meta">
        ${p.cliente  ? `<span class="badge">${p.cliente}</span>`  : ''}
        ${p.zona     && p.zona !== '0' ? `<span class="badge">${p.zona}</span>` : ''}
        ${p.linea    && p.linea !== '0' ? `<span class="badge">${p.linea}</span>` : ''}
        ${p.tipo     && p.tipo !== '0'  ? `<span class="badge">${p.tipo}</span>`  : ''}
        ${p.estado   ? `<span class="badge ${p.estado==='En ejecución'?'green':p.estado==='Cerrado'?'red':'amber'}">${p.estado}</span>` : ''}
        ${p.wip_flag === 'Y' ? '<span class="badge green">WIP ✓</span>' : '<span class="badge">WIP N</span>'}
      </div>
    </div>

    <p class="section-title">Datos básicos</p>
    <div class="grid-4">
      <div class="kpi"><div class="kpi-label">Importe contratación</div><div class="kpi-value">${fmtE(p.importe)}</div></div>
      <div class="kpi"><div class="kpi-label">Coste estimado</div><div class="kpi-value">${fmtE(p.coste_est)}</div></div>
      <div class="kpi"><div class="kpi-label">Rentabilidad SF</div><div class="kpi-value ${rentColor(p.rent_sf)}">${fmtP(p.rent_sf)}</div></div>
      <div class="kpi"><div class="kpi-label">R a aplicar</div><div class="kpi-value ${rentColor(p.r_aplicar)}">${fmtP(p.r_aplicar)}</div></div>
    </div>
    <div class="grid-2">
      <div class="kpi"><div class="kpi-label">Responsable</div><div class="kpi-value" style="font-size:.95rem">${p.resp && p.resp !== '0' ? p.resp : '⚠ Sin asignar'}</div></div>
      <div class="kpi"><div class="kpi-label">Intercompany</div><div class="kpi-value" style="font-size:.95rem">${p.interco || '—'}</div></div>
    </div>

    <p class="section-title">Seguimiento del mes (Abril 2026)</p>
    <div class="grid-4">
      <div class="kpi"><div class="kpi-label">Revenues del mes</div><div class="kpi-value ${cls(p.rev_mes)}">${fmtE(p.rev_mes)}</div></div>
      <div class="kpi"><div class="kpi-label">Ingresos abril</div><div class="kpi-value">${fmtE(p.months[3].ing)}</div></div>
      <div class="kpi"><div class="kpi-label">Costes abril</div><div class="kpi-value">${fmtE(p.months[3].gtos + p.months[3].prov)}</div></div>
      <div class="kpi"><div class="kpi-label">WIP mensual</div><div class="kpi-value ${cls(p.months[3].wip)}">${fmtE(p.months[3].wip)}</div></div>
    </div>

    <p class="section-title">Acumulado 2026</p>
    <div class="grid-4">
      <div class="kpi"><div class="kpi-label">Revenues 2026</div><div class="kpi-value ${cls(p.rev_2026)}">${fmtE(p.rev_2026)}</div></div>
      <div class="kpi"><div class="kpi-label">WIP a origen</div><div class="kpi-value ${cls(p.wip_origen)}">${fmtE(p.wip_origen)}</div></div>
      <div class="kpi"><div class="kpi-label">WIP 2026</div><div class="kpi-value ${cls(p.wip_2026)}">${fmtE(p.wip_2026)}</div></div>
      <div class="kpi"><div class="kpi-label">Backlog</div><div class="kpi-value">${fmtE(p.backlog)}</div></div>
    </div>
    <div class="grid-2">
      <div class="kpi"><div class="kpi-label">Facturación pendiente</div><div class="kpi-value">${fmtE(p.fact_pdte)}</div></div>
      <div class="kpi"><div class="kpi-label">Histórico ingresos 2025</div><div class="kpi-value">${fmtE(p.ing_2025)}</div><div class="kpi-sub">Costes: ${fmtE(p.gtos_2025 + p.prov_2025)} · WIP cierre: ${fmtE(p.wip_2025)}</div></div>
    </div>

    <p class="section-title">Mensualización completa 2026</p>
    <div class="monthly-wrap">
      <table>
        <thead>
          <tr>
            <th style="text-align:left">Mes</th>
            <th>Ingresos</th>
            <th>Gastos</th>
            <th>Provisión</th>
            <th>Total costes</th>
            <th>Margen bruto</th>
            <th>WIP</th>
          </tr>
        </thead>
        <tbody>
          ${monthRows}
          <tr class="total-row">
            <td>TOTAL</td>
            <td>${fmtE(totIng)}</td>
            <td>${fmtE(totGtos)}</td>
            <td>${fmtE(totProv)}</td>
            <td>${fmtE(totCost)}</td>
            <td class="${cls(totMB)}">${fmtE(totMB)}</td>
            <td>—</td>
          </tr>
        </tbody>
      </table>
    </div>
  `;
}
</script>
</body>
</html>
